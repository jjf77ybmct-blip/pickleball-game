<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bandy Pickleball Club</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:24px 14px;
  background:radial-gradient(circle at top,#223b4e,#0b1320);
  color:#eef6ff;font-family:Arial,sans-serif;text-align:center;
}
header{max-width:460px;margin:auto}
small{color:#79dbc3;letter-spacing:3px;font-weight:bold}
h1{font-size:30px;margin:10px 0;color:#ffd166}
.subtitle{font-size:14px;color:#b5c5d6;line-height:1.6}
.scoreboard{
  display:flex;justify-content:space-around;align-items:center;
  max-width:440px;margin:18px auto;padding:16px;
  border:1px solid #ffffff20;border-radius:18px;background:#ffffff08;
}
.name{font-size:12px;letter-spacing:2px;color:#bbcadb}
.score{font-size:38px;font-weight:bold;margin-top:5px}
.you{color:#ffd166}.cpu{color:#ff8792}
canvas{
  display:block;width:100%;max-width:440px;margin:auto;
  border-radius:20px;box-shadow:0 20px 60px #0007;
  touch-action:none;
}
#message{min-height:40px;font-size:14px;color:#c9d8e6}
button{
  border:0;border-radius:12px;padding:13px 18px;margin:4px;
  cursor:pointer;font-weight:bold;font-size:14px;
  background:#ffd166;color:#142334;
}
.secondary{background:#ffffff12;color:white;border:1px solid #ffffff25}
button:active{transform:scale(.97)}
footer{font-size:12px;color:#8ea4b8;margin-top:18px}
</style>
</head>
<body>
<header>
  <small>BANDY PICKLEBALL CLUB</small>
  <h1>🏓 Court Challenge</h1>
  <div class="subtitle">
    Gerakkan tetikus, seret jari atau guna ← →.<br>
    Gaya arked · Setiap rali satu mata · Menang beza 2
  </div>
</header>

<div class="scoreboard">
  <div><div class="name">BANDY</div><div id="you" class="score you">0</div></div>
  <div style="color:#8399ae">HINGGA 11</div>
  <div><div class="name">KOMPUTER</div><div id="cpu" class="score cpu">0</div></div>
</div>

<canvas id="court" width="440" height="640"></canvas>
<p id="message" aria-live="polite">Bersedia bro? Tekan Mula / Servis!</p>
<button id="start">▶ Mula / Servis</button>
<button id="reset" class="secondary">↻ Main Semula</button>
<button id="sound" class="secondary">Bunyi: ON</button>
<footer>Kuning: Bandy · Merah: Komputer</footer>
<div>
  <p id="shotLabel">Pukulan: DRIVE</p>
  <button id="driveBtn" onclick="pilihPukulan('drive')">
    1 · Drive
  </button>
  <button id="volleyBtn" onclick="pilihPukulan('volley')">
    2 · Volley
  </button>
  <button id="dinkBtn" onclick="pilihPukulan('dink')">
    3 · Dink
  </button>
</div>
<script>
const canvas=document.getElementById("court");
const c=canvas.getContext("2d");
const message=document.getElementById("message");
const W=440,H=640;
const player={x:220,y:566,swing:0};
const cpu={x:220,y:74,swing:0};
const ball={x:220,y:320,vx:0,vy:0,r:7};
let yourScore=0,cpuScore=0,active=false,finished=false;
let left=false,right=false,last=0,clock=0;
let particles=[],muted=false,audio;

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function textScore(){
  document.getElementById("you").textContent=yourScore;
  document.getElementById("cpu").textContent=cpuScore;
}
function prepare(){ball.x=220;ball.y=320}
function enableAudio(){
  try{
    const A=window.AudioContext||window.webkitAudioContext;
    if(!audio&&A)audio=new A();
    if(audio&&audio.state==="suspended")audio.resume().catch(()=>{});
  }catch(e){}
}
function pop(){
  if(muted||!audio||audio.state!=="running")return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type="sine";
  o.frequency.setValueAtTime(650,audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(170,audio.currentTime+.07);
  g.gain.setValueAtTime(.1,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+.1);
}
function burst(x,y){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;
    const speed=40+Math.random()*110;
    particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:.35});
  }
}
function serve(){
  enableAudio();
  if(active||finished)return;
  prepare();
  ball.vx=(Math.random()-.5)*200;
  ball.vy=Math.random()<.5?265:-265;
  active=true;
  message.textContent="Fokus bola, bro! 🏓";
}
function point(mine){
  active=false;
  if(mine)yourScore++;else cpuScore++;
  textScore();prepare();
  finished=Math.max(yourScore,cpuScore)>=11&&
    Math.abs(yourScore-cpuScore)>=2;
  if(finished){
    message.textContent=yourScore>cpuScore
      ?"🏆 Bandy juara! Tekan Main Semula untuk bermain lagi."
      :"Komputer menang. Rematch bro? 💪";
  }else{
    message.textContent=mine
      ?"🔥 Mata Bandy! Tekan Mula / Servis."
      :"Mata komputer. Cuba lagi—tekan Mula / Servis.";
  }
}
let pukulan = "drive";

const jenisPukulan = {
  drive: {
    nama: "DRIVE",
    laju: 420,
    sudut: 230,
    warna: "#ffd166"
  },
  volley: {
    nama: "VOLLEY",
    laju: 350,
    sudut: 330,
    warna: "#ff8792"
  },
  dink: {
    nama: "DINK",
    laju: 185,
    sudut: 110,
    warna: "#79dbc3"
  }
};

function pilihPukulan(jenis) {
  if (!jenisPukulan[jenis]) return;

  pukulan = jenis;
  const pilihan = jenisPukulan[jenis];

  document.getElementById("shotLabel").textContent =
    "Pukulan: " + pilihan.nama;

  for (const nama of Object.keys(jenisPukulan)) {
    const butang = document.getElementById(nama + "Btn");
    const dipilih = nama === jenis;

    butang.style.background = dipilih
      ? pilihan.warna
      : "#263b50";

    butang.style.color = dipilih ? "#142334" : "white";
    butang.setAttribute("aria-pressed", String(dipilih));
  }
}

function hit(person, direction) {
  const offset = clamp((ball.x - person.x) / 49, -1, 1);

  // Komputer memilih pukulan sendiri.
  let jenis = pukulan;

  if (person === cpu) {
    const rawak = Math.random();
    jenis = rawak < 0.5
      ? "drive"
      : rawak < 0.8 ? "volley" : "dink";
  }

  const pilihan = jenisPukulan[jenis];

  ball.vx = offset * pilihan.sudut;
  ball.vy = direction * pilihan.laju;

  person.swing = 1;
  burst(ball.x, ball.y);
  pop();

  message.textContent = person === player
    ? "🏓 Bandy: " + pilihan.nama + "!"
    : "Komputer: " + pilihan.nama + " — bersedia bro!";
}
function update(dt){
  clock+=dt;
  player.swing=Math.max(0,player.swing-dt*5);
  cpu.swing=Math.max(0,cpu.swing-dt*5);
  if(left)player.x-=350*dt;
  if(right)player.x+=350*dt;
  player.x=clamp(player.x,65,375);

  particles=particles.filter(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    return p.life>0;
  });
  if(!active)return;

  const target=ball.vy<0?ball.x:220;
  const d=target-cpu.x;
  cpu.x+=Math.sign(d)*Math.min(Math.abs(d),160*dt);
  cpu.x=clamp(cpu.x,65,375);

  const oldY=ball.y;
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<31){ball.x=31;ball.vx=Math.abs(ball.vx)}
  if(ball.x>409){ball.x=409;ball.vx=-Math.abs(ball.vx)}

  if(ball.vy>0&&oldY+ball.r<=538&&ball.y+ball.r>=538&&
    Math.abs(ball.x-player.x)<=49){
    ball.y=538-ball.r;hit(player,-1);
  }
  if(ball.vy<0&&oldY-ball.r>=102&&ball.y-ball.r<=102&&
    Math.abs(ball.x-cpu.x)<=49){
    ball.y=102+ball.r;hit(cpu,1);
  }
  if(ball.y<-15)point(true);
  else if(ball.y>655)point(false);
}
function ellipse(x,y,rx,ry,color){
  c.fillStyle=color;c.beginPath();
  c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();
}
function line(x1,y1,x2,y2,color,width){
  c.strokeStyle=color;c.lineWidth=width;c.lineCap="round";
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
}
function drawCourt(){
  const bg=c.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#124739");bg.addColorStop(1,"#1a6650");
  c.fillStyle=bg;c.fillRect(0,0,W,H);

  c.fillStyle="#ffffff04";
  for(let y=0;y<H;y+=32)c.fillRect(0,y,W,16);

  c.fillStyle="#2477a0";c.fillRect(24,24,392,592);
  c.fillStyle="#205f87";c.fillRect(24,216,392,208);
  c.strokeStyle="#edf7ed";c.lineWidth=3;
  c.strokeRect(24,24,392,592);
  line(24,216,416,216,"#edf7ed",2);
  line(24,424,416,424,"#edf7ed",2);
  line(220,24,220,216,"#edf7ed",2);
  line(220,424,220,616,"#edf7ed",2);

  c.fillStyle="#ffffff28";c.font="bold 12px Arial";
  c.textAlign="center";
  c.fillText("KITCHEN",220,265);
  c.fillText("KITCHEN",220,387);

  // Bayang dan jaring net.
  c.fillStyle="#0003";c.fillRect(15,321,410,13);
  c.fillStyle="#102e3cbb";c.fillRect(15,308,410,17);
  for(let x=18;x<425;x+=10)line(x,309,x,325,"#ffffff55",1);
  line(15,316,425,316,"#ffffff55",1);
  line(15,308,425,308,"white",3);
  line(15,302,15,331,"#dce5ed",6);
  line(425,302,425,331,"#dce5ed",6);
}
function drawPerson(p,color,top){
  const facing=top?1:-1;
  c.save();c.translate(p.x,p.y);
  ellipse(0,13,27,11,"#0004");

  // Kasut, kaki dan baju.
  ellipse(-10,16,7,10,"#e5edf4");
  ellipse(10,16,7,10,"#e5edf4");
  line(-9,9,-9,16,"#263244",9);
  line(9,9,9,16,"#263244",9);
  ellipse(0,1,21,20,color);
  line(-17,0,-25,facing*10,"#dca477",9);

  // Tangan dan paddle berayun ke tengah ketika memukul.
  const paddleX=27*(1-p.swing);
  const paddleY=facing*(22+6*p.swing);
  line(16,0,paddleX,paddleY-facing*9,"#dca477",9);
  line(paddleX,paddleY-facing*8,paddleX,paddleY,"#423126",5);

  c.save();c.translate(paddleX,paddleY+facing*7);
  c.rotate((top?-1:1)*(.25-p.swing*.8));
  c.fillStyle="#152131";c.strokeStyle="#d7e7f5";c.lineWidth=2;
  c.beginPath();c.ellipse(0,0,11,15,0,0,Math.PI*2);
  c.fill();c.stroke();
  line(-5,-5,5,5,"#68e1c3",2);
  line(5,-5,-5,5,"#68e1c3",2);
  c.restore();

  // Kepala, rambut dan visor.
  ellipse(0,-9,12,13,"#e8b58d");
  ellipse(0,-16,12,6,"#30241f");
  line(-10,-13,10,-13,color,5);
  c.restore();
}
function drawBall(){
  const lift=active?5+Math.abs(Math.sin(clock*7))*9:4;
  ellipse(ball.x+5,ball.y+lift,8,4,"#0005");
  ellipse(ball.x,ball.y,ball.r,ball.r,"#eaff53");
  ellipse(ball.x-2,ball.y-2,2,2,"#ffffff99");
  [[3,0],[-2,3],[0,-4]].forEach(([x,y])=>{
    ellipse(ball.x+x,ball.y+y,1.1,1.1,"#718225");
  });
}
function draw(){
  drawCourt();
  drawPerson(cpu,"#ff7485",true);
  drawPerson(player,"#ffd166",false);
  drawBall();
  for(const p of particles){
    c.globalAlpha=Math.max(0,p.life/.35);
    ellipse(p.x,p.y,2.5,2.5,"#fff4b0");
  }
  c.globalAlpha=1;
  if(!active){
    c.fillStyle="#081725d9";c.fillRect(85,284,270,64);
    c.fillStyle="#fff";c.textAlign="center";
    c.font="bold 17px Arial";
    c.fillText(finished?"PERLAWANAN TAMAT":"SEDIA UNTUK SERVIS",220,311);
    c.font="12px Arial";c.fillStyle="#ffd166";
    c.fillText(finished?"Tekan Main Semula":"Tekan butang Mula / Servis",220,333);
  }
}
function frame(t){
  const dt=last?Math.min((t-last)/1000,.025):0;
  last=t;update(dt);draw();requestAnimationFrame(frame);
}
function move(e){
  const r=canvas.getBoundingClientRect();
  player.x=clamp((e.clientX-r.left)*W/r.width,65,375);
}
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);move(e);
});
canvas.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse"||e.buttons)move(e);
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    e.preventDefault();
    if(e.key==="ArrowLeft")left=true;else right=true;
  }
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")left=false;
  if(e.key==="ArrowRight")right=false;
});
window.addEventListener("blur",()=>{left=false;right=false});
document.getElementById("start").onclick=serve;
document.getElementById("reset").onclick=()=>{
  active=false;finished=false;yourScore=0;cpuScore=0;
  player.x=cpu.x=220;player.swing=cpu.swing=0;
  particles=[];prepare();textScore();
  message.textContent="Jom rematch! Tekan Mula / Servis.";
};
document.getElementById("sound").onclick=function(){
  muted=!muted;
  this.textContent=muted?"Bunyi: OFF":"Bunyi: ON";
  if(!muted)enableAudio();
  
};
  document.addEventListener("keydown", function(event) {
  if (event.repeat) return;

  if (event.key === "1") pilihPukulan("drive");
  if (event.key === "2") pilihPukulan("volley");
  if (event.key === "3") pilihPukulan("dink");
});

pilihPukulan("drive");
requestAnimationFrame(frame);
</script>
</body>
</html>
